<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Check-in</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1f2328;
    --muted: #6b7078;
    --line: #e4e0d8;
    --accent: #2f6fdb;
    --accent-ink: #ffffff;
    --good: #2e9a5b;
    --good-soft: #d5efdf;
    --part: #e7b43c;
    --part-soft: #f8ecc9;
    --danger: #c8443a;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171b; --card: #1e2127; --ink: #e8e9ec; --muted: #9aa0a9; --line: #2e323a;
      --accent: #5b8ff0; --accent-ink: #0d1117; --good: #4cc27f; --good-soft: #1f3a2b;
      --part: #e7b43c; --part-soft: #3d3420; --danger: #e86a5f; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171b; --card: #1e2127; --ink: #e8e9ec; --muted: #9aa0a9; --line: #2e323a;
    --accent: #5b8ff0; --accent-ink: #0d1117; --good: #4cc27f; --good-soft: #1f3a2b;
    --part: #e7b43c; --part-soft: #3d3420; --danger: #e86a5f; --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .sub { color: var(--muted); font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
  .dayhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .dayhead .date { font-size: 18px; font-weight: 650; }
  .dayhead .nav { display: flex; gap: 4px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .icon-btn { background: transparent; border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; }
  .icon-btn:hover { border-color: var(--muted); }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 8px 14px; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .add { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .add input[type=text] { flex: 1 1 200px; }
  input, select, textarea {
    font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 10px; min-width: 0;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .add input[type=number] { width: 76px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--muted); }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  ul.plan { list-style: none; margin: 0 0 14px; padding: 0; }
  ul.plan li { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  ul.plan li:last-child { border-bottom: 0; }
  ul.plan input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--good); flex: none; }
  ul.plan .txt { flex: 1; overflow-wrap: anywhere; }
  ul.plan li.done .txt { color: var(--muted); text-decoration: line-through; }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; flex: none; }
  .mins { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .del { background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 4px; }
  .del:hover { color: var(--danger); }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 0 16px; }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .progress > div { height: 100%; background: var(--good); width: 0; transition: width .25s; }
  label.lbl { display: block; font-size: 13px; color: var(--muted); margin: 6px 0 6px; }
  textarea { width: 100%; min-height: 84px; resize: vertical; }
  .checkin { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .checkin .btn.primary.done { background: var(--good); border-color: var(--good); }
  .checkin .note { color: var(--muted); font-size: 13px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head b { font-size: 16px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
  .cal .d {
    aspect-ratio: 1; border-radius: 8px; border: 1px solid transparent; background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px;
    font-variant-numeric: tabular-nums; position: relative; padding: 0;
  }
  .cal .d:hover { border-color: var(--line); }
  .cal .d.out { visibility: hidden; }
  .cal .d.future { color: var(--muted); opacity: .5; }
  .cal .d.plan { background: var(--part-soft); }
  .cal .d.checked { background: var(--good-soft); color: var(--good); font-weight: 650; }
  .cal .d.today { border-color: var(--accent); }
  .cal .d.sel { outline: 2px solid var(--ink); outline-offset: -2px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .history { margin-top: 16px; }
  .history .row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
  .history .row:last-child { border-bottom: 0; }
  .history .row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 9px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>English Check-in</h1>
      <div class="sub" id="greeting"></div>
    </div>
    <button class="btn small" id="themeBtn" title="Toggle theme">Theme</button>
  </header>

  <section class="stats">
    <div class="stat"><b id="sStreak">0</b><span>day streak</span></div>
    <div class="stat"><b id="sBest">0</b><span>best streak</span></div>
    <div class="stat"><b id="sDays">0</b><span>days checked in</span></div>
    <div class="stat"><b id="sHours">0</b><span>hours studied</span></div>
  </section>

  <div class="grid">
    <section class="card">
      <div class="dayhead">
        <div>
          <div class="date" id="dayTitle"></div>
          <div class="sub" id="daySub"></div>
        </div>
        <div class="nav">
          <button class="icon-btn" id="prevDay" title="Previous day">‹</button>
          <button class="btn small" id="toToday">Today</button>
          <button class="icon-btn" id="nextDay" title="Next day">›</button>
        </div>
      </div>

      <h2>Plan</h2>
      <form class="add" id="addForm">
        <input type="text" id="taskText" placeholder="e.g. Learn 30 new words, watch one TED talk…" maxlength="200" autocomplete="off">
        <input type="number" id="taskMin" placeholder="min" min="0" max="600" title="Planned minutes">
        <button class="btn primary" type="submit">Add</button>
      </form>
      <div class="chips" id="cats"></div>

      <div class="progress"><div id="bar"></div></div>
      <ul class="plan" id="plan"></ul>
      <div class="add" style="margin-top:-4px">
        <button class="btn small" id="copyPrev" type="button">Copy plan from previous day</button>
      </div>

      <label class="lbl" for="note">Notes — new words, sentences, what you learned</label>
      <textarea id="note" placeholder="serendipity — finding something good by chance…"></textarea>

      <div class="checkin">
        <button class="btn primary" id="checkBtn">Check in</button>
        <span class="note" id="checkNote"></span>
      </div>
    </section>

    <aside>
      <section class="card">
        <div class="cal-head">
          <button class="icon-btn" id="prevMonth" title="Previous month">‹</button>
          <b id="monthTitle"></b>
          <button class="icon-btn" id="nextMonth" title="Next month">›</button>
        </div>
        <div class="cal" id="cal"></div>
        <div class="legend">
          <span><i style="background:var(--good-soft);border:1px solid var(--good)"></i>Checked in</span>
          <span><i style="background:var(--part-soft)"></i>Planned only</span>
          <span><i style="border:1px solid var(--accent)"></i>Today</span>
        </div>
      </section>

      <section class="card history">
        <h2>Recent check-ins</h2>
        <div id="history"></div>
        <div class="tools">
          <button class="btn small" id="exportBtn">Export backup</button>
          <button class="btn small" id="importBtn">Import backup</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
        <div class="sub" style="font-size:12px;margin-top:8px">Data is saved in this browser only. Export a backup now and then.</div>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'english-checkin-v1';
  const CATS = ['Vocabulary', 'Listening', 'Speaking', 'Reading', 'Writing', 'Grammar'];
  const $ = (id) => document.getElementById(id);

  // ---------- storage ----------
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && d.days) return d;
    } catch (e) {}
    return { days: {} };
  }
  let db = load();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { toast('Could not save — browser storage is unavailable'); }
  }

  // ---------- dates ----------
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const todayKey = () => keyOf(new Date());

  let sel = todayKey();
  let viewMonth = parse(sel); viewMonth.setDate(1);
  let cat = '';

  const day = (k) => db.days[k] || { plan: [], note: '', checked: false };
  function ensure(k) {
    if (!db.days[k]) db.days[k] = { plan: [], note: '', checked: false };
    return db.days[k];
  }
  function prune(k) {
    const d = db.days[k];
    if (d && !d.plan.length && !d.note.trim() && !d.checked) delete db.days[k];
  }
  const minutesOf = (d) => d.plan.filter(t => t.done).reduce((s, t) => s + (t.min || 0), 0);

  // ---------- stats ----------
  function streaks() {
    const checked = new Set(Object.keys(db.days).filter(k => db.days[k].checked));
    let cur = 0, k = todayKey();
    if (!checked.has(k)) k = addDays(k, -1);      // today not done yet still keeps the streak
    while (checked.has(k)) { cur++; k = addDays(k, -1); }
    let best = 0, run = 0, prev = null;
    [...checked].sort().forEach(k2 => {
      run = prev && addDays(prev, 1) === k2 ? run + 1 : 1;
      best = Math.max(best, run); prev = k2;
    });
    let mins = 0;
    Object.values(db.days).forEach(d => { mins += minutesOf(d); });
    return { cur, best, days: checked.size, hours: Math.round(mins / 6) / 10 };
  }

  // ---------- render ----------
  const fmtLong = (k) => parse(k).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const fmtShort = (k) => parse(k).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

  function renderStats() {
    const s = streaks();
    $('sStreak').textContent = s.cur;
    $('sBest').textContent = s.best;
    $('sDays').textContent = s.days;
    $('sHours').textContent = s.hours;
    const t = day(todayKey());
    $('greeting').textContent = t.checked
      ? 'Checked in today — nice work. Keep it going tomorrow.'
      : s.cur ? `You're on a ${s.cur}-day streak. Check in today to keep it.` : 'Write today\'s plan, do it, then check in.';
  }

  function renderCats() {
    $('cats').innerHTML = '';
    CATS.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip' + (cat === c ? ' on' : ''); b.textContent = c;
      b.onclick = () => { cat = cat === c ? '' : c; renderCats(); $('taskText').focus(); };
      $('cats').appendChild(b);
    });
  }

  function renderDay() {
    const d = day(sel), t = todayKey();
    $('dayTitle').textContent = sel === t ? 'Today' : sel === addDays(t, -1) ? 'Yesterday' : sel === addDays(t, 1) ? 'Tomorrow' : fmtShort(sel);
    $('daySub').textContent = fmtLong(sel);
    $('toToday').style.visibility = sel === t ? 'hidden' : 'visible';

    const ul = $('plan'); ul.innerHTML = '';
    if (!d.plan.length) {
      ul.innerHTML = '<li class="empty" style="border:0">No plan yet. Add what you\'ll study today.</li>';
    }
    d.plan.forEach(item => {
      const li = document.createElement('li'); if (item.done) li.className = 'done';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!item.done;
      cb.onchange = () => { item.done = cb.checked; save(); renderAll(); };
      const txt = document.createElement('span'); txt.className = 'txt'; txt.textContent = item.text;
      txt.title = 'Double-click to edit';
      txt.ondblclick = () => {
        const v = prompt('Edit task', item.text);
        if (v && v.trim()) { item.text = v.trim(); save(); renderDay(); }
      };
      li.append(cb, txt);
      if (item.cat) { const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = item.cat; li.append(tg); }
      if (item.min) { const m = document.createElement('span'); m.className = 'mins'; m.textContent = item.min + ' min'; li.append(m); }
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '×'; del.title = 'Remove';
      del.onclick = () => { d.plan = d.plan.filter(x => x !== item); prune(sel); save(); renderAll(); };
      li.append(del);
      ul.appendChild(li);
    });

    const done = d.plan.filter(x => x.done).length;
    $('bar').style.width = d.plan.length ? (done / d.plan.length * 100) + '%' : '0';

    if (document.activeElement !== $('note')) $('note').value = d.note || '';

    const btn = $('checkBtn'), isFuture = sel > t;
    btn.disabled = isFuture;
    btn.style.opacity = isFuture ? .5 : 1;
    btn.classList.toggle('done', !!d.checked);
    btn.textContent = d.checked ? '✓ Checked in' : 'Check in';
    const mins = minutesOf(d);
    $('checkNote').textContent = isFuture ? 'You can plan ahead, but check in on the day.'
      : d.checked ? `${done}/${d.plan.length} tasks done${mins ? ` · ${mins} min` : ''} · click to undo`
      : d.plan.length ? `${done}/${d.plan.length} tasks done` : '';
    $('copyPrev').style.display = d.plan.length ? 'none' : '';
  }

  function renderCal() {
    const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
    $('monthTitle').textContent = viewMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const cal = $('cal'); cal.innerHTML = '';
    ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach(w => {
      const e = document.createElement('div'); e.className = 'dow'; e.textContent = w; cal.appendChild(e);
    });
    const lead = (new Date(y, m, 1).getDay() + 6) % 7;
    for (let i = 0; i < lead; i++) { const e = document.createElement('div'); e.className = 'd out'; cal.appendChild(e); }
    const n = new Date(y, m + 1, 0).getDate(), t = todayKey();
    for (let i = 1; i <= n; i++) {
      const k = `${y}-${pad(m + 1)}-${pad(i)}`, d = db.days[k];
      const b = document.createElement('button'); b.className = 'd'; b.textContent = i;
      if (d && d.checked) b.classList.add('checked'); else if (d && d.plan.length) b.classList.add('plan');
      if (k === t) b.classList.add('today');
      if (k > t) b.classList.add('future');
      if (k === sel) b.classList.add('sel');
      b.title = fmtLong(k) + (d && d.checked ? ' — checked in' : '');
      b.onclick = () => { sel = k; renderAll(); };
      cal.appendChild(b);
    }
  }

  function renderHistory() {
    const keys = Object.keys(db.days).filter(k => db.days[k].checked).sort().reverse().slice(0, 7);
    const h = $('history'); h.innerHTML = '';
    if (!keys.length) { h.innerHTML = '<div class="empty">Your check-ins will show up here.</div>'; return; }
    keys.forEach(k => {
      const d = db.days[k], done = d.plan.filter(x => x.done).length, mins = minutesOf(d);
      const r = document.createElement('div'); r.className = 'row';
      const a = document.createElement('span'); a.textContent = fmtShort(k);
      const b = document.createElement('span'); b.textContent = `${done}/${d.plan.length} tasks${mins ? ' · ' + mins + ' min' : ''}`;
      r.append(a, b); r.onclick = () => { sel = k; viewMonth = parse(k); viewMonth.setDate(1); renderAll(); };
      h.appendChild(r);
    });
  }

  function renderAll() { renderStats(); renderDay(); renderCal(); renderHistory(); }

  // ---------- actions ----------
  function go(k) {
    sel = k;
    const d = parse(k);
    if (d.getMonth() !== viewMonth.getMonth() || d.getFullYear() !== viewMonth.getFullYear()) { viewMonth = d; viewMonth.setDate(1); }
    renderAll();
  }

  $('addForm').onsubmit = (e) => {
    e.preventDefault();
    const text = $('taskText').value.trim();
    if (!text) { $('taskText').focus(); return; }
    const min = Math.max(0, Math.min(600, parseInt($('taskMin').value, 10) || 0));
    ensure(sel).plan.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, cat, min, done: false });
    save();
    $('taskText').value = ''; $('taskMin').value = ''; $('taskText').focus();
    renderAll();
  };

  $('copyPrev').onclick = () => {
    let k = addDays(sel, -1);
    for (let i = 0; i < 60; i++, k = addDays(k, -1)) {
      const d = db.days[k];
      if (d && d.plan.length) {
        ensure(sel).plan = d.plan.map(x => ({ ...x, id: x.id + 'c' + Date.now().toString(36), done: false }));
        save(); renderAll(); toast('Copied plan from ' + fmtShort(k)); return;
      }
    }
    toast('No earlier plan found');
  };

  let noteTimer;
  $('note').oninput = () => {
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { ensure(sel).note = $('note').value; prune(sel); save(); renderCal(); }, 300);
  };
  $('note').onblur = () => { clearTimeout(noteTimer); ensure(sel).note = $('note').value; prune(sel); save(); renderCal(); };

  $('checkBtn').onclick = () => {
    if (sel > todayKey()) return;
    const d = ensure(sel);
    d.note = $('note').value;
    d.checked = !d.checked;
    d.checkedAt = d.checked ? new Date().toISOString() : undefined;
    prune(sel); save(); renderAll();
    if (d.checked) toast(streaks().cur > 1 ? `Checked in! ${streaks().cur}-day streak 🔥` : 'Checked in! 🎉');
  };

  $('prevDay').onclick = () => go(addDays(sel, -1));
  $('nextDay').onclick = () => go(addDays(sel, 1));
  $('toToday').onclick = () => go(todayKey());
  $('prevMonth').onclick = () => { viewMonth.setMonth(viewMonth.getMonth() - 1); renderCal(); };
  $('nextMonth').onclick = () => { viewMonth.setMonth(viewMonth.getMonth() + 1); renderCal(); };

  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `english-checkin-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || typeof data.days !== 'object') throw new Error();
      if (!confirm('Merge this backup into your current records? Days in the backup replace the same days here.')) return;
      Object.assign(db.days, data.days); save(); renderAll(); toast('Backup imported');
    } catch (err) { toast('That file is not a valid backup'); }
    e.target.value = '';
  };

  // theme
  const root = document.documentElement;
  try { const th = localStorage.getItem(KEY + '-theme'); if (th) root.dataset.theme = th; } catch (e) {}
  $('themeBtn').onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem(KEY + '-theme', root.dataset.theme); } catch (e) {}
  };

  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // roll over to the new day if the page stays open past midnight
  let lastToday = todayKey();
  setInterval(() => { const t = todayKey(); if (t !== lastToday) { if (sel === lastToday) sel = t; lastToday = t; go(sel); } }, 60000);

  renderCats();
  renderAll();
})();
</script>
</body>
</html>
